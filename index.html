<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f1"><title>茶米家旺旺旺 (*Ü*)｡:°ஐ*</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#31594c;background:#f6f7f1}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:26px 18px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:27px;margin:3px 0 0;letter-spacing:1px}.sub{color:#8b9b90;font-size:13px}.leaf{font-size:30px}.card{background:#fff;border:1px solid #e2eae1;border-radius:22px;padding:20px;margin:15px 0;box-shadow:0 4px 18px #4d6a5510}.hero{background:#dcecdf;border:0}.hero strong{font-size:23px}.stats{display:flex;gap:8px;margin-top:16px}.stat{flex:1;background:#ffffffa8;padding:12px;border-radius:14px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:#6d8777}h2{font-size:19px;margin:0 0 16px}.seg{display:flex;gap:7px;flex-wrap:wrap}.seg button,.chip{border:0;background:#edf3ed;border-radius:999px;padding:9px 13px;color:#577364;font-size:13px}.seg button.active{background:#3c927c;color:white}form{display:grid;gap:10px}input,select,textarea{font:inherit;border:1px solid #dce5db;background:#fafcf9;color:#31594c;border-radius:12px;padding:12px;width:100%}textarea{resize:vertical;min-height:62px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{cursor:pointer;font:inherit}.primary{background:#398f79;border:0;color:white;border-radius:13px;padding:13px 17px;font-weight:700}.task{display:flex;align-items:flex-start;gap:12px;padding:15px 0;border-bottom:1px dashed #e4e9e2}.task:last-child{border-bottom:0}.task{border-left:4px solid transparent;padding-left:11px;border-radius:5px}.task.priority-high{border-left-color:#c65b55}.task.priority-normal{border-left-color:#d6a24c}.task.priority-low{border-left-color:#67a58a}.task.is-done{border-left-color:#d5dfd7}.meta .priority-high{background:#fce6e4;color:#a94944;font-weight:700}.meta .priority-normal{background:#fff0d7;color:#946521;font-weight:700}.meta .priority-low{background:#e1f0e6;color:#39765b;font-weight:700}.check{width:24px;height:24px;flex-shrink:0;border:2px solid #b9cec1;border-radius:8px;background:white;margin-top:2px}.check.done{background:#40947e;border-color:#40947e;color:white}.taskbody{flex:1;min-width:0}.taskname{font-size:16px;overflow-wrap:anywhere}.doneText{text-decoration:line-through;color:#a2afa6}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.meta span{font-size:11px;background:#f1f5ef;border-radius:8px;padding:4px 7px;color:#698274}.meta .late{background:#fce8e3;color:#ae6150}.del{border:0;background:transparent;color:#a8b4aa;font-size:20px;padding:0 4px}.empty{text-align:center;padding:30px 10px;color:#91a096}.footer{text-align:center;color:#a4b3a8;font-size:12px;margin-top:22px}.hint{font-size:12px;color:#839789;margin-top:9px}.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}#clear{background:none;border:0;color:#859b8c;font-size:12px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #398f79;outline-offset:2px}
</style></head><body><main><header><div><div class="sub">CHAMI FAMILY · V1.1</div><h1>茶米家旺旺旺 (*Ü*)｡:°ஐ*</h1><div class="sub">金馬獎十年養成計劃</div></div><div class="leaf">🍵</div></header><section class="card hero"><div class="sub" id="today"></div><strong id="greet">今天也一起嗲米狗！</strong><div class="stats"><div class="stat"><b id="pending">0</b><span>待完成</span></div><div class="stat"><b id="finished">0</b><span>已完成</span></div><div class="stat"><b id="overdue">0</b><span>已逾期</span></div></div></section><section class="card"><h2>✍️ 記下一件事</h2><form id="form"><input id="name" required maxlength="100" placeholder="例如：幫茶米補充飼料 🐶" aria-label="待辦事項"><div class="two"><select id="owner" aria-label="負責人"><option>我們一起</option><option>我</option><option>祥豪</option></select><select id="category" aria-label="分類"><option>生活</option><option>工作</option><option>採買</option><option>茶米</option><option>其他</option></select></div><div class="two"><label class="sub">截止日期<input id="due" type="date"></label><label class="sub">優先順序<select id="priority"><option>一般</option><option>重要</option><option>不急</option></select></label></div><button class="primary" type="submit">＋ 新增待辦</button></form></section><section class="card"><div class="tools"><h2>🗒️ 我們的待辦</h2><button id="clear" type="button">清除已完成</button></div><div class="seg" id="filters"><button data-filter="全部" class="active">全部</button><button data-filter="我">我的</button><button data-filter="祥豪">祥豪的</button><button data-filter="我們一起">共同</button><button data-filter="已完成">已完成</button></div><div id="tasks" aria-live="polite"></div></section><div class="footer">小小的事，也值得好好完成 ♡<div class="hint">此版本資料儲存在目前瀏覽器中，並非雙人雲端同步。</div></div></main><script>
const key='our-little-days-v1';let tasks=[];try{tasks=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(tasks))tasks=[]}catch(e){tasks=[]}let filter='全部';const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(key,JSON.stringify(tasks))}catch(e){alert('瀏覽器無法儲存資料，請確認非無痕模式。')}};const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=localDate(new Date());$('today').textContent=new Intl.DateTimeFormat('zh-TW',{dateStyle:'full'}).format(new Date());function render(){let active=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);$('pending').textContent=active.length;$('finished').textContent=done.length;$('overdue').textContent=active.filter(t=>t.due&&t.due<today).length;let list=tasks.filter(t=>filter==='全部'||(filter==='已完成'?t.done:t.owner===filter||(filter==='我'&&t.owner==='我們一起'))).sort((a,b)=>Number(a.done)-Number(b.done)||Number(b.priority==='重要')-Number(a.priority==='重要')||(a.due||'9999').localeCompare(b.due||'9999'));const root=$('tasks');root.replaceChildren();if(!list.length){let e=document.createElement('div');e.className='empty';e.textContent='這裡還沒有待辦，先記下一件小事吧 ☁️';root.append(e)}list.forEach(t=>{const row=document.createElement('div');row.className='task '+(t.done?'is-done':t.priority==='重要'?'priority-high':t.priority==='不急'?'priority-low':'priority-normal');const check=document.createElement('button');check.className='check'+(t.done?' done':'');check.textContent=t.done?'✓':'';check.setAttribute('aria-label',t.done?'標記未完成':'標記完成');check.onclick=()=>{t.done=!t.done;save();render()};const body=document.createElement('div');body.className='taskbody';const title=document.createElement('div');title.className='taskname'+(t.done?' doneText':'');title.textContent=t.name;title.title='點擊可編輯';title.style.cursor='pointer';title.onclick=()=>{let name=prompt('修改待辦內容',t.name);if(name!==null&&name.trim()){t.name=name.trim().slice(0,100);save();render()}};const meta=document.createElement('div');meta.className='meta';[t.owner,t.category,t.priority,t.due?(t.due<today&&!t.done?'已逾期 · ':'期限 · ')+t.due:null].filter(Boolean).forEach(s=>{let tag=document.createElement('span');tag.textContent=s;if(s.startsWith('已逾期'))tag.className='late';else if(s===t.priority)tag.className=s==='重要'?'priority-high':s==='不急'?'priority-low':'priority-normal';meta.append(tag)});body.append(title,meta);const del=document.createElement('button');del.className='del';del.textContent='×';del.setAttribute('aria-label','刪除 '+t.name);del.onclick=()=>{if(confirm('確定刪除這件待辦嗎？')){tasks=tasks.filter(x=>x.id!==t.id);save();render()}};row.append(check,body,del);root.append(row)})} $('form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;tasks.unshift({id:globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random(),name,owner:$('owner').value,category:$('category').value,priority:$('priority').value,due:$('due').value,done:false});save();$('form').reset();render();$('name').focus()};$('filters').onclick=e=>{const b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));render()};$('clear').onclick=()=>{if(tasks.some(t=>t.done)&&confirm('確定清除所有已完成事項？')){tasks=tasks.filter(t=>!t.done);save();render()}};render();
</script></body></html>
