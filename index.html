<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f1"><title>茶米家旺旺旺 (*Ü*)｡:°ஐ*</title><link rel="icon" type="image/png" href="./favicon.png"><link rel="apple-touch-icon" sizes="180x180" href="./tebi-icon-180.png"><link rel="manifest" href="./manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#31594c;background:#f6f7f1}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:26px 18px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:27px;margin:3px 0 0;letter-spacing:1px}.sub{color:#8b9b90;font-size:13px}.leaf{font-size:30px}.card{background:#fff;border:1px solid #e2eae1;border-radius:22px;padding:20px;margin:15px 0;box-shadow:0 4px 18px #4d6a5510}.hero{background:#dcecdf;border:0}.hero strong{font-size:23px}.stats{display:flex;gap:8px;margin-top:16px}.stat{flex:1;background:#ffffffa8;padding:12px;border-radius:14px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:#6d8777}h2{font-size:19px;margin:0 0 16px}.seg{display:flex;gap:7px;flex-wrap:wrap}.seg button,.chip{border:0;background:#edf3ed;border-radius:999px;padding:9px 13px;color:#577364;font-size:13px}.seg button.active{background:#3c927c;color:white}form{display:grid;gap:10px}input,select,textarea{font:inherit;border:1px solid #dce5db;background:#fafcf9;color:#31594c;border-radius:12px;padding:12px;width:100%}textarea{resize:vertical;min-height:62px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{cursor:pointer;font:inherit}.primary{background:#398f79;border:0;color:white;border-radius:13px;padding:13px 17px;font-weight:700}.task{display:flex;align-items:flex-start;gap:12px;padding:15px 0;border-bottom:1px dashed #e4e9e2}.task:last-child{border-bottom:0}.task{border-left:4px solid transparent;padding-left:11px;border-radius:5px}.task.priority-high{border-left-color:#c65b55}.task.priority-normal{border-left-color:#d6a24c}.task.priority-low{border-left-color:#67a58a}.task.is-done{border-left-color:#d5dfd7}.meta .priority-high{background:#fce6e4;color:#a94944;font-weight:700}.meta .priority-normal{background:#fff0d7;color:#946521;font-weight:700}.meta .priority-low{background:#e1f0e6;color:#39765b;font-weight:700}.check{width:24px;height:24px;flex-shrink:0;border:2px solid #b9cec1;border-radius:8px;background:white;margin-top:2px}.check.done{background:#40947e;border-color:#40947e;color:white}.taskbody{flex:1;min-width:0}.taskname{font-size:16px;overflow-wrap:anywhere}.doneText{text-decoration:line-through;color:#a2afa6}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.meta span{font-size:11px;background:#f1f5ef;border-radius:8px;padding:4px 7px;color:#698274}.meta .late{background:#fce8e3;color:#ae6150}.del{border:0;background:transparent;color:#a8b4aa;font-size:20px;padding:0 4px}.empty{text-align:center;padding:30px 10px;color:#91a096}.footer{text-align:center;color:#a4b3a8;font-size:12px;margin-top:22px}.hint{font-size:12px;color:#839789;margin-top:9px}.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}#clear{background:none;border:0;color:#859b8c;font-size:12px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #398f79;outline-offset:2px}

.auth-card{max-width:480px;margin:28px auto}.auth-card h2{margin-bottom:12px}.auth-card p{font-size:13px;color:#6b8475;line-height:1.6}.auth-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.auth-actions button{flex:1}.secondary{background:#edf3ed;border:0;color:#31594c;border-radius:13px;padding:12px}.error{color:#ad4c4c!important}.success{color:#347b63!important}.userbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:13px;color:#698274}.userbar button{border:0;background:#e3eee4;border-radius:10px;padding:8px 12px;color:#31594c}#app{display:none}#auth{display:block}
</style></head><body><main><section id="auth" class="card auth-card"><div class="sub">TEBI FAMILY · V1.4.1</div><h2>🐶 歡迎回茶米家</h2><p id="auth-intro">用 Email 登入，今天也一起嗲米狗！</p><form id="auth-form"><input type="email" id="auth-email" autocomplete="email" placeholder="Email" required><input type="password" id="auth-password" autocomplete="current-password" minlength="6" placeholder="密碼（至少 6 字元）" required><button id="auth-submit" class="primary" type="submit">登入</button></form><div class="auth-actions"><button class="secondary" type="button" id="auth-reset">忘記密碼／設定密碼</button></div><p id="auth-message" role="status" aria-live="polite"></p><p>第一次使用邀請帳號？請先按「忘記密碼／設定密碼」，透過信箱建立自己的密碼。</p></section><div id="app"><div class="userbar"><span id="user-email"></span><button type="button" id="signout">登出</button></div><header><div><div class="sub">TEBI FAMILY · V1.4.1</div><h1>茶米家旺旺旺 (*Ü*)｡:°ஐ*</h1><div class="sub">金馬獎十年養成計劃</div></div><div class="leaf">🍵</div></header><section class="card hero"><div class="sub" id="today"></div><strong id="greet">今天也一起嗲米狗！</strong><div class="stats"><div class="stat"><b id="pending">0</b><span>待完成</span></div><div class="stat"><b id="finished">0</b><span>已完成</span></div><div class="stat"><b id="overdue">0</b><span>已逾期</span></div></div></section><section class="card"><h2>✍️ 記下一件事</h2><form id="form"><input id="name" required maxlength="100" placeholder="例如：幫茶米補充飼料 🐶" aria-label="待辦事項"><div class="two"><select id="owner" aria-label="負責人"><option>我們一起</option><option>許貝貝</option><option>阿哺</option></select><select id="category" aria-label="分類"><option>生活</option><option>工作</option><option>採買</option><option>茶米</option><option>其他</option></select></div><div class="two"><label class="sub">截止日期<input id="due" type="date"></label><label class="sub">優先順序<select id="priority"><option>一般</option><option>重要</option><option>不急</option></select></label></div><button class="primary" type="submit">＋ 新增待辦</button></form></section><section class="card"><div class="tools"><h2>🗒️ 我們的待辦</h2><button id="clear" type="button">清除已完成</button></div><div class="seg" id="filters"><button data-filter="全部" class="active">全部</button><button data-filter="我">我的</button><button data-filter="祥豪">阿哺的</button><button data-filter="我們一起">共同</button><button data-filter="已完成">已完成</button></div><div id="cloud-status" class="hint" role="status" aria-live="polite">登入後載入雲端待辦。</div><div id="tasks" aria-live="polite"></div></section><div class="footer">小小的事，也值得好好完成 ♡<div class="hint">V1.4.1 雲端共享版 · 待辦儲存在茶米家的 Supabase 雲端。</div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const PROJECT_URL='https://ljqgfyxpcggsnruitiha.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_Kxq2WMyEs-DWIAbya1wK9Q_KrCTip1Z';
const sb=window.supabase?.createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{detectSessionInUrl:true,flowType:'implicit'}});
const authMessage=(message,isError=false)=>{const el=document.getElementById('auth-message');el.textContent=message;el.className=isError?'error':'success'};
const setBusy=(busy)=>{document.getElementById('auth-submit').disabled=busy;document.getElementById('auth-reset').disabled=busy};
const showSession=(session)=>{const logged=!!session?.user;document.getElementById('auth').style.display=logged?'none':'block';document.getElementById('app').style.display=logged?'block':'none';document.getElementById('user-email').textContent=logged?'登入中：'+(session.user.email||'使用者'):'';if(typeof handleSession==='function')handleSession(session)};
async function initializeAuth(){if(!sb){authMessage('無法載入登入元件，請確認網路連線後重新整理。',true);return}const {data,error}=await sb.auth.getSession();if(error)authMessage(error.message,true);showSession(data?.session);const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('error_description'))authMessage(hash.get('error_description'),true);if(hash.get('type')==='recovery'||location.hash.includes('type=recovery')){document.getElementById('auth-intro').textContent='請設定你的新密碼';document.getElementById('auth-submit').textContent='儲存新密碼';document.getElementById('auth-email').required=false;document.getElementById('auth-email').style.display='none';document.getElementById('auth').style.display='block';document.getElementById('app').style.display='none';window.recoveryMode=true}sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){window.recoveryMode=true;document.getElementById('auth-intro').textContent='請設定你的新密碼';document.getElementById('auth-submit').textContent='儲存新密碼';document.getElementById('auth-email').required=false;document.getElementById('auth-email').style.display='none';document.getElementById('auth').style.display='block';document.getElementById('app').style.display='none'}else if(!window.recoveryMode)showSession(session)})}
document.getElementById('auth-form').addEventListener('submit',async e=>{e.preventDefault();if(!sb)return;setBusy(true);try{const password=document.getElementById('auth-password').value;if(window.recoveryMode){const {error}=await sb.auth.updateUser({password});if(error)throw error;window.recoveryMode=false;history.replaceState(null,'',location.pathname);document.getElementById('auth-password').value='';authMessage('密碼設定成功！');const {data}=await sb.auth.getSession();showSession(data?.session)}else{const email=document.getElementById('auth-email').value.trim();const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;authMessage('登入成功！')}}catch(err){authMessage('操作失敗：'+err.message,true)}finally{setBusy(false)}});
document.getElementById('auth-reset').addEventListener('click',async()=>{if(!sb)return;const email=document.getElementById('auth-email').value.trim();if(!email){authMessage('請先輸入你的 Email。',true);return}setBusy(true);try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://babybabylintw.github.io/tebi-family/'});if(error)throw error;authMessage('如果這個信箱已有帳號，系統會寄出設定密碼連結。請查看收件匣及垃圾郵件。')}catch(err){authMessage('寄送失敗：'+err.message,true)}finally{setBusy(false)}});
document.getElementById('signout').addEventListener('click',async()=>{if(!sb)return;const {error}=await sb.auth.signOut();if(error)alert(error.message);else showSession(null)});
initializeAuth();
// 雲端版：舊 localStorage 保留不變，不自動搬移或刪除。
const $=id=>document.getElementById(id);
const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=localDate(new Date());
$('today').textContent=new Intl.DateTimeFormat('zh-TW',{dateStyle:'full'}).format(new Date());
let tasks=[], filter='全部', householdId=null, members=[], currentUser=null, loadGeneration=0, saving=false;
const status=(msg,error=false)=>{const el=$('cloud-status');el.textContent=msg;el.className=error?'hint error':'hint'};
const priorityToDb={'重要':'重要','一般':'一般','不急':'不急'};
const priorityFromDb={'high':'重要','normal':'一般','low':'不急','重要':'重要','一般':'一般','不急':'不急'};
const memberName=id=>members.find(m=>m.user_id===id)?.display_name||'家庭成員';
const ownerName=id=>id?memberName(id):'我們一起';
const assignedId=()=>{const value=$('owner').value;return members.find(m=>m.display_name===value)?.user_id||null};
const setControlsDisabled=disabled=>{$('form').querySelectorAll('input,select,button').forEach(el=>el.disabled=disabled);$('clear').disabled=disabled};
function render(){
 const active=tasks.filter(t=>!t.completed),done=tasks.filter(t=>t.completed);
 $('pending').textContent=active.length;$('finished').textContent=done.length;
 $('overdue').textContent=active.filter(t=>t.due_date&&t.due_date<today).length;
 let list=tasks.filter(t=>filter==='全部'||(filter==='已完成'?t.completed:filter==='我們一起'?!t.assigned_to:filter==='我'?(t.assigned_to===currentUser?.id||!t.assigned_to):t.assigned_to===members.find(m=>m.display_name==='阿哺')?.user_id)).sort((a,b)=>Number(a.completed)-Number(b.completed)||Number((priorityFromDb[b.priority]||b.priority)==='重要')-Number((priorityFromDb[a.priority]||a.priority)==='重要')||(a.due_date||'9999').localeCompare(b.due_date||'9999'));
 const root=$('tasks');root.replaceChildren();
 if(!list.length){const el=document.createElement('div');el.className='empty';el.textContent='這裡還沒有待辦，先記下一件小事吧 ☁️';root.append(el)}
 for(const t of list){
  const p=priorityFromDb[t.priority]||'一般';const row=document.createElement('div');row.className='task '+(t.completed?'is-done':p==='重要'?'priority-high':p==='不急'?'priority-low':'priority-normal');
  const check=document.createElement('button');check.className='check'+(t.completed?' done':'');check.textContent=t.completed?'✓':'';check.disabled=saving;check.setAttribute('aria-label',t.completed?'標記未完成':'標記完成');check.onclick=()=>updateTask(t,{completed:!t.completed});
  const body=document.createElement('div');body.className='taskbody';const title=document.createElement('div');title.className='taskname'+(t.completed?' doneText':'');title.textContent=t.title;title.title='點擊可編輯';title.style.cursor='pointer';title.onclick=()=>{if(saving)return;const name=prompt('修改待辦內容',t.title);if(name!==null&&name.trim())updateTask(t,{title:name.trim().slice(0,100)})};
  const meta=document.createElement('div');meta.className='meta';[ownerName(t.assigned_to),t.category,p,t.due_date?(t.due_date<today&&!t.completed?'已逾期 · ':'期限 · ')+t.due_date:null].filter(Boolean).forEach(value=>{const tag=document.createElement('span');tag.textContent=value;if(value.startsWith('已逾期'))tag.className='late';else if(value===p)tag.className=p==='重要'?'priority-high':p==='不急'?'priority-low':'priority-normal';meta.append(tag)});
  body.append(title,meta);const del=document.createElement('button');del.className='del';del.textContent='×';del.disabled=saving;del.setAttribute('aria-label','刪除 '+t.title);del.onclick=()=>{if(confirm('確定刪除這件待辦嗎？'))deleteTask(t)};row.append(check,body,del);root.append(row)
 }
}
async function handleSession(session){
 const generation=++loadGeneration;currentUser=session?.user||null;householdId=null;members=[];tasks=[];render();
 if(!currentUser){status('登入後載入雲端待辦。');setControlsDisabled(true);return}
 setControlsDisabled(true);status('正在連接茶米家雲端…');
 try{
  const {data:memberRows,error:memberError}=await sb.from('household_members').select('household_id,user_id,display_name').eq('user_id',currentUser.id);
  if(memberError)throw memberError;if(generation!==loadGeneration)return;
  if(!memberRows?.length)throw Error('此帳號尚未加入家庭，請檢查 household_members。');
  householdId=memberRows[0].household_id;
  const {data:allMembers,error:allError}=await sb.from('household_members').select('household_id,user_id,display_name').eq('household_id',householdId);
  if(allError)throw allError;if(generation!==loadGeneration)return;
  members=allMembers||[];
  const owner=$('owner');owner.replaceChildren();
  const together=new Option('我們一起','我們一起');owner.add(together);
  for(const m of members)owner.add(new Option(m.display_name,m.display_name));
  const selfName=memberName(currentUser.id);$('user-email').textContent=`${selfName} · ${currentUser.email||''}`;
  await refreshTasks(generation);if(generation===loadGeneration)setControlsDisabled(false);
 }catch(err){if(generation!==loadGeneration)return;status('無法載入家庭資料：'+err.message,true);setControlsDisabled(true)}
}
async function refreshTasks(generation=loadGeneration){
 if(!householdId||!currentUser)return;
 const id=householdId;
 const {data,error}=await sb.from('tasks').select('id,household_id,title,category,priority,assigned_to,due_date,completed,notes,created_by,created_at,updated_at').eq('household_id',id).order('created_at',{ascending:false});
 if(generation!==loadGeneration||householdId!==id)return;
 if(error){status('雲端讀取失敗：'+error.message,true);return}
 tasks=data||[];render();status('☁️ 已連線 · 兩人共用同一份待辦清單');
}
async function perform(action){if(saving||!householdId)return;saving=true;setControlsDisabled(true);status('正在儲存到雲端…');try{await action();await refreshTasks()}catch(err){status('儲存失敗：'+err.message,true);alert('雲端儲存失敗：'+err.message)}finally{saving=false;if(householdId)setControlsDisabled(false);render()}}
async function updateTask(t,changes){await perform(async()=>{const {error}=await sb.from('tasks').update(changes).eq('id',t.id).eq('household_id',householdId);if(error)throw error})}
async function deleteTask(t){await perform(async()=>{const {error}=await sb.from('tasks').delete().eq('id',t.id).eq('household_id',householdId);if(error)throw error})}
$('form').onsubmit=e=>{e.preventDefault();const title=$('name').value.trim();if(!title||!currentUser||!householdId)return;const row={id:crypto.randomUUID(),household_id:householdId,title,category:$('category').value,priority:priorityToDb[$('priority').value],assigned_to:assignedId(),due_date:$('due').value||null,completed:false,notes:'',created_by:currentUser.id};perform(async()=>{const {error}=await sb.from('tasks').insert(row);if(error)throw error;$('form').reset();$('name').focus()})};
$('filters').onclick=e=>{const b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));render()};
$('clear').onclick=()=>{const done=tasks.filter(t=>t.completed);if(!done.length||!confirm(`確定清除 ${done.length} 件已完成事項？`))return;perform(async()=>{const {error}=await sb.from('tasks').delete().eq('household_id',householdId).eq('completed',true);if(error)throw error})};
setControlsDisabled(true);render();
// 兩個裝置每 15 秒檢查雲端更新；切回頁面時也會刷新。
setInterval(()=>{if(householdId&&!saving&&!document.hidden)refreshTasks()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&householdId&&!saving)refreshTasks()});
</script></body></html>
